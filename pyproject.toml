[project]
name = "chesstrainer"
version = "0.1.0"
description = "Screen-overlay chess trainer: best-move arrows, grounded explanations, and an opening trainer."
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "simonlunay" }]
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "mss>=9.0",
    "PyQt6>=6.7",
    "torch>=2.4",
    "torchvision>=0.19",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "tqdm>=4.66",
    "keyring>=25",
]

[project.urls]
Homepage = "https://github.com/simonlunay/ChessTrainer"
Issues = "https://github.com/simonlunay/ChessTrainer/issues"

[project.scripts]
chesstrainer = "chesstrainer.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML",
    "onnx>=1.23.2",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesstrainer"]

# CUDA builds of PyTorch on Windows/Linux; macOS falls back to PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
